<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbiter Admin — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
  <style>
    .settings-wrap { max-width:1100px; padding-bottom:24px; }


    /* Sections + masonry columns + collapsible cards (built by enhanceSettingsLayout) */
    .set-nav { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 14px; position:sticky; top:64px; z-index:40; padding:6px 0; }
    .set-nav button { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); background:var(--bg2); border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; transition:color .15s, border-color .15s; }
    .set-nav button:hover, .set-nav button.on { color:var(--accent); border-color:var(--accent); }
    .set-nav .set-nav-all { margin-left:auto; border-style:dashed; }
    .set-sec { margin-bottom:22px; scroll-margin-top:120px; }
    .set-sec-title { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:0 2px 8px; font-weight:500; }
    .set-cols > .settings-group.wide, .set-cols > .set-seg { margin-bottom:8px; }
    .set-seg { display:flex; gap:8px; align-items:flex-start; }
    .set-col { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
    @media (max-width: 860px) { .set-seg { flex-direction:column; } .set-col { width:100%; } }
    .settings-group.collapsible > .group-header { cursor:pointer; user-select:none; }
    .settings-group.collapsible > .group-header::after { content:'▾'; margin-left:auto; font-size:11px; color:var(--muted); transition:transform .2s; }
    .settings-group.collapsible > .group-header:hover { color:var(--heading); }
    .settings-group.collapsible.collapsed > .group-header { border-bottom-color:transparent; }
    .settings-group.collapsible.collapsed > .group-header::after { transform:rotate(-90deg); }
    .settings-group.collapsible.collapsed > :not(.group-header) { display:none !important; }
    .settings-group.collapsible > .group-header:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

    /* Two-column grid for settings groups */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: start;
      margin-bottom: 8px;
    }
    .settings-grid .settings-group { margin-bottom: 0; }
    .settings-wrap > .settings-group { margin-bottom: 8px; }

    @media (max-width: 720px) {
      .settings-wrap { max-width: 720px; }
      .settings-grid { grid-template-columns: 1fr; }
    }

    /* Toggle switch */
    .toggle { position:relative; display:inline-block; width:36px; height:20px; flex-shrink:0; cursor:pointer; justify-self:end; }
    .toggle input { opacity:0; width:0; height:0; }
    .toggle-slider { position:absolute; inset:0; background:var(--line); border-radius:10px; transition:background 0.2s; }
    .toggle-slider::before { content:''; position:absolute; width:16px; height:16px; left:2px; bottom:2px; background:var(--bg0); border-radius:50%; transition:transform 0.2s; }
    .toggle input:checked + .toggle-slider { background:var(--accent); }
    .toggle input:checked + .toggle-slider::before { transform:translateX(16px); }

    /* Card — einheitliches bg2, eine Farbe, kein Alternieren */
    .settings-group {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    /* Section label — klein, ruhig, ◆ statt Left-Strip */
    .group-header {
      padding: 8px 20px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .group-header::before { content: "◆"; color: var(--gold); font-size: 5px; line-height: 1; }

    /* Setting row — hover, keine alternierenden Hintergründe */
    /* rows that hold a list (API keys, webhooks) use the full width instead of the 220px control column */
    .setting-row.setting-row-wide { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
    .setting-row {
      display: grid;
      grid-template-columns: 1fr 220px;
      align-items: center;
      gap: 16px;
      padding: 11px 20px;
      border-bottom: 1px solid var(--line2);
      transition: background 0.1s;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-row:hover { background: var(--hover-bg); }
    .setting-label { font-size: 13px; color: var(--heading); margin-bottom: 3px; }
    .setting-desc { font-size: 11px; color: var(--mid); line-height: 1.55; }

    /* Inputs — vollständig gerundete Box, weicher Focus */
    .settings-wrap .input {
      width: 100%;
      background: var(--bg0);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 11px;
      color: var(--heading);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .settings-wrap .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .settings-wrap .input[readonly] {
      color: var(--muted);
      cursor: default;
      background: var(--bg1);
    }

    /* Save row */
    .save-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 20px;
      border-top: 1px solid var(--line);
      gap: 10px;
    }

    /* Banners */
    .banner { padding: 8px 16px; font-size: 11px; display: flex; align-items: center; gap: 8px; border-radius: 8px; margin-bottom: 8px; }
    .banner-ok  { background: var(--jade-bg); color: var(--jade); border: 1px solid rgba(45,139,106,.2); }
    .banner-ok::before { content: "✓"; font-size: 12px; }
    .banner-err { background: var(--red-bg); color: var(--red); border: 1px solid rgba(240,112,128,.18); }
    .banner-err::before { content: "✕"; font-size: 12px; }

    /* Theme cards */
    .theme-cards { display: flex; gap: 10px; flex-wrap: wrap; }
    .theme-cards.palette { display: grid; grid-template-columns: repeat(5, 1fr); }
    @media (max-width: 640px) { .theme-cards.palette { grid-template-columns: repeat(2, 1fr); } }
    .theme-card {
      flex: 1; min-width: 110px;
      background: var(--bg0);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 14px 12px;
      cursor: pointer;
      text-align: left;
      font-family: var(--mono);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .theme-card:hover { border-color: var(--mid); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .theme-card.active { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
    .theme-swatch { display: flex; gap: 4px; margin-bottom: 10px; height: 4px; }
    .theme-swatch span { flex: 1; border-radius: 2px; }
    .theme-card-name { font-size: 12px; color: var(--heading); margin-bottom: 2px; font-weight: 500; }
    .theme-card-sub  { font-size: 10px; color: var(--mid); letter-spacing: 0.03em; line-height: 1.4; }

    /* Style cards */
    .style-cards { display: flex; gap: 10px; }
    .style-card {
      flex: 1; min-width: 120px; max-width: 180px;
      background: var(--bg0); border: 1px solid var(--line); border-radius: 8px;
      padding: 12px 12px 10px; cursor: pointer; text-align: left;
      font-family: var(--mono); transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .style-card:hover { border-color: var(--mid); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .style-card.active { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
    .style-preview {
      display: flex; gap: 5px; height: 44px; margin-bottom: 10px;
      background: var(--bg3); border-radius: 5px; overflow: hidden; position: relative;
    }
    .sp-sidebar { width: 14px; background: var(--bg2); flex-shrink: 0; }
    .sp-body { flex: 1; padding: 5px 5px; display: flex; flex-direction: column; gap: 4px; }
    .sp-row { height: 6px; background: var(--bg2); border-radius: 2px; }
    .sp-row-short { width: 65%; }
    /* Glass preview */
    .sp-glass { background: var(--bg0); }
    .sp-orb { position: absolute; border-radius: 50%; }
    .sp-orb1 { width: 40px; height: 40px; top: -10px; left: 10px; background: var(--accent-bg); filter: blur(8px); }
    .sp-orb2 { width: 30px; height: 30px; bottom: -5px; right: 10px; background: var(--gold-bg); filter: blur(6px); }
    .sp-glass-panel { background: color-mix(in srgb, var(--bg2) 60%, transparent); backdrop-filter: blur(4px); border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); border-radius: 3px; }
    .sp-glass .sp-sidebar { width: 14px; background: color-mix(in srgb, var(--bg1) 55%, transparent); backdrop-filter: blur(4px); }

    /* Pod section */
    .pod-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 20px;
      border-bottom: 1px solid var(--line2);
    }
    .pod-meta-path {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .pod-meta-ver {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--bg3);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 8px;
    }
    .pod-col-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      border-bottom: 1px solid var(--line2);
      transition: background 0.1s;
    }
    .pod-col-row:last-child { border-bottom: none; }
    .pod-col-row:hover { background: var(--hover-bg); }
    .pod-col-name { font-size: 13px; color: var(--text); }
    .pod-col-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: var(--bg3);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 8px;
    }

    /* Pod stats strip */
    .pod-stat-label { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }

    /* Support */
    .support-widget {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 20px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: var(--bg2);
    }
    .support-copy-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .support-copy-text { font-size: 12px; color: var(--text); line-height: 1.6; }
    .btn-support {
      flex-shrink: 0;
      padding: 8px 18px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
      border-radius: 6px;
    }
    .btn-support:hover { background: var(--gold); color: var(--bg0); }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="logo" href="/dashboard.html"><div class="logo-mark">OR</div>Orbiter</a>
      <div class="topbar-right">
        <button class="search-trigger" id="search-btn" title="Search (⌘K)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Search <kbd>⌘K</kbd>
        </button>
        <button class="scheme-toggle" id="scheme-toggle" title="Toggle scheme">◐</button>
        <span class="user" id="topbar-user"></span>
        <span class="logout" id="logout-btn">Sign out</span>
      </div>
    </header>
    <nav class="sidebar">
      <div class="nav-section">Content</div>
      <a class="nav-item" href="/dashboard.html"><span class="nav-icon">◈</span>Dashboard</a>
      <a class="nav-item" href="/collections.html"><span class="nav-icon">⊞</span>Collections</a>
      <div class="nav-section">Assets</div>
      <a class="nav-item" href="/media.html"><span class="nav-icon">⊟</span>Media</a>
      <div class="nav-section">Tools</div>
      <a class="nav-item" href="/inbox.html"><span class="nav-icon">✉</span>Inbox</a>
      <a class="nav-item" href="/snippets.html"><span class="nav-icon">⌗</span>Snippets</a>

      <div class="nav-section">System</div>
      <a class="nav-item" href="/schema.html"><span class="nav-icon">◈</span>Schema</a>
      <a class="nav-item" href="/build.html"><span class="nav-icon">▲</span>Build</a>
      <a class="nav-item active" href="/settings.html"><span class="nav-icon">◎</span>Settings</a>
      <a class="nav-item admin-only" href="/users.html" style="display:none"><span class="nav-icon">◉</span>Users</a>
            <a class="nav-item admin-only" href="/pods.html" style="display:none"><span class="nav-icon">◈</span>Pods</a>
      <div class="sidebar-footer">
        <div class="pod-name" id="pod-name">content.pod</div>
        <div class="pod-info" id="pod-info"></div>
        <div class="pod-version" id="pod-version"></div>
        <div class="pod-status"><span class="pod-dot"></span>pod synced</div>
      </div>
    </nav>
    <main class="main">
      <div class="page-header glass-card" style="display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;margin-bottom:4px;">
        <h1 class="page-title">Settings</h1>
        <div style="display:flex;align-items:center;gap:10px">
          <span id="header-save-msg" style="font-size:10px;color:var(--jade);opacity:0;transition:opacity .3s"></span>
          <button type="submit" form="site-form" class="btn-save" id="header-save-btn">Save settings</button>
        </div>
      </div>
      <div class="settings-wrap" id="settings-content">
        <div class="empty"><div class="spinner"></div></div>
      </div>
    
  <script type="module">
    const me = await fetch('/api/auth/me',{credentials:'include'}).then(r=>r.json()).catch(()=>null);
    if (!me?.user) { location.replace('/login.html'); throw new Error('unauthenticated'); }
    document.getElementById('topbar-user').textContent = me.user.username;
    if (me.user.role==='admin') document.querySelectorAll('.admin-only').forEach(el=>el.style.display='');
    document.getElementById('logout-btn').addEventListener('click',async()=>{
      await fetch('/api/auth/logout',{method:'POST',credentials:'include'});
      location.replace('/login.html');
    });

    const meta = await fetch('/api/meta',{credentials:'include'}).then(r=>r.json()).catch(()=>({}));

    const get = k => meta[k] ?? '';
    // pod-info managed by sidebar.js

    function showBanner(id, cls, text) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'banner ' + cls;
      el.textContent = (cls==='banner-ok'?'✓ ':'✕ ') + text;
      el.style.display = '';
      setTimeout(()=>el.style.display='none', 3500);
    }

    async function saveMeta(pairs) {
      const body = Object.fromEntries(pairs);
      await fetch('/api/meta', {
        method:'PUT', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body),
      });
    }

    const ghConfigured   = !!(get('github.token') && get('github.repo'));
    const currentTheme  = localStorage.getItem('orb_theme') || get('ui.theme') || 'space'; // what is actually applied
    const THEMES = [{"id": "space", "name": "Space", "sub": "Calm blue &amp; teal", "sw": ["#080e18", "#6a9ed4", "#46c8a8", "#38b89c"]}, {"id": "missionctl", "name": "missionctl", "sub": "Terminal green \u00b7 indigo \u00b7 violet", "sw": ["#0a0a0f", "#00d97e", "#00d97e", "#f59e0b"]}, {"id": "zen", "name": "Zen", "sub": "Japandi \u00b7 slate &amp; mauve", "sw": ["#0f0e10", "#7888a0", "#80a884", "#c89090"]}, {"id": "catppuccin", "name": "Catppuccin", "sub": "Mocha / Latte \u00b7 soft pastel", "sw": ["#11111b", "#cba6f7", "#a6e3a1", "#fab387"]}, {"id": "amber", "name": "Terminal", "sub": "Amber phosphor \u00b7 neutral paper", "sw": ["#0c0b08", "#d99a1a", "#8cc46a", "#e0a100"]}, {"id": "paper", "name": "Paper", "sub": "Whiteboard \u00b7 black &amp; white", "sw": ["#0a0a0a", "#e8e8e8", "#6fcf8a", "#e8e8e8"]}, {"id": "nord", "name": "Nord", "sub": "Arctic \u00b7 frost blue", "sw": ["#242933", "#88c0d0", "#a3be8c", "#ebcb8b"]}, {"id": "gruvbox", "name": "Gruvbox", "sub": "Retro \u00b7 warm earth tones", "sw": ["#1d2021", "#83a598", "#b8bb26", "#fabd2f"]}, {"id": "dracula", "name": "Dracula", "sub": "Purple &amp; pink on charcoal", "sw": ["#1e1f29", "#bd93f9", "#5be08a", "#ece27e"]}, {"id": "tokyo-night", "name": "Tokyo Night", "sub": "Neon city \u00b7 blue &amp; violet", "sw": ["#16161e", "#7aa2f7", "#9ece6a", "#e0af68"]}];
    const CC = (() => { try { return JSON.parse(localStorage.getItem('orb_custom') || '{}'); } catch { return {}; } })();
    const currentScheme = localStorage.getItem('orb_scheme') || 'auto';
    const currentStyle  = localStorage.getItem('orb_style')  || 'xfce'; // same default as theme.js


    // Sections, balanced columns, collapsible cards, jump bar. The DOM above stays as is; this only regroups it.
    function enhanceSettingsLayout(root) {
      const form = root.querySelector('#site-form');
      // controls inside the form keep submitting with it after their cards move out
      if (form) form.querySelectorAll('input,select,textarea,button').forEach(el => { if (!el.hasAttribute('form')) el.setAttribute('form', 'site-form'); });
      const SECTIONS = [
        ['you',      'You',        ['Appearance', 'Account']],
        ['general',  'General',    ['Site', 'Dashboard widgets', 'Build & Language', 'AI Assistant', 'Email notifications']],
        ['content',  'Content',    ['Media', 'Preview URLs', 'Import', 'Templates']],
        ['publish',  'Publishing', ['GitHub', 'GitHub Sync', 'Public API', 'FTP / FTPS Deploy']],
        ['system',   'System',     ['Pod']],
      ];
      const OPEN = new Set(['Appearance', 'Account', 'Site', 'Dashboard widgets', 'Build & Language']);
      const WIDE = new Set(['Appearance', 'Account', 'Pod', 'Import', 'Templates', 'FTP / FTPS Deploy']);
      let saved = {}; try { saved = JSON.parse(localStorage.getItem('orb_set_open') || '{}'); } catch {}
      const titleOf = g => { const h = g.querySelector(':scope > .group-header'); return h ? h.textContent.replace(/^Account\s*—.*/, 'Account').trim() : ''; };
      const groups = [...root.querySelectorAll('.settings-group')].filter(g => g.querySelector(':scope > .group-header'));
      const byTitle = new Map(groups.map(g => [titleOf(g), g]));
      const nav = document.createElement('nav'); nav.className = 'set-nav'; nav.setAttribute('aria-label', 'Settings sections');
      const frag = document.createDocumentFragment();
      const siteBanner = root.querySelector('#site-banner'); if (siteBanner) frag.appendChild(siteBanner);
      frag.appendChild(nav);
      if (form) { form.hidden = true; frag.appendChild(form); }
      const used = new Set();
      const mk = (id, label, titles) => {
        const items = titles.map(t => byTitle.get(t)).filter(Boolean);
        if (!items.length) return;
        const sec = document.createElement('section'); sec.className = 'set-sec'; sec.id = 'sec-' + id;
        sec.innerHTML = '<h2 class="set-sec-title">' + label + '</h2><div class="set-cols"></div>';
        const cols = sec.querySelector('.set-cols');
        let seg = null;
        items.forEach(g => {
          used.add(g);
          // conditional status banners belong to their card
          const b = root.querySelector({ 'GitHub Sync': '#github-banner', 'Account': '#account-banner' }[titleOf(g)] || '#none');
          const t = titleOf(g); const wide = WIDE.has(t); g.classList.toggle('wide', wide);
          const h = g.querySelector(':scope > .group-header');
          if (b) h.after(b);
          g.classList.add('collapsible'); g.dataset.t = t;
          const open = t in saved ? !!saved[t] : OPEN.has(t);
          g.classList.toggle('collapsed', !open);
          h.tabIndex = 0; h.setAttribute('role', 'button'); h.setAttribute('aria-expanded', String(open));
          const toggle = () => { const c = g.classList.toggle('collapsed'); h.setAttribute('aria-expanded', String(!c)); saved[t] = !c; try { localStorage.setItem('orb_set_open', JSON.stringify(saved)); } catch {} balanceAll(); };
          h.addEventListener('click', toggle);
          h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
          if (wide) { seg = null; cols.appendChild(g); return; }
          if (!seg) { seg = document.createElement('div'); seg.className = 'set-seg'; seg._cards = []; seg.innerHTML = '<div class="set-col"></div><div class="set-col"></div>'; cols.appendChild(seg); }
          seg._cards.push(g); seg.firstChild.appendChild(g);
        });
        const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = label; btn.dataset.sec = id;
        btn.addEventListener('click', () => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }));
        nav.appendChild(btn); frag.appendChild(sec);
      };
      // two columns, each card goes to the currently shorter one (measured), re-run on toggle/resize
      const balanceAll = () => {
        const narrow = window.matchMedia('(max-width: 860px)').matches;
        root.querySelectorAll('.set-seg').forEach(seg => {
          const [a, bb] = seg.children; const cards = seg._cards;
          cards.forEach(c => a.appendChild(c));
          if (narrow) return;
          const hs = cards.map(c => c.offsetHeight); let ha = 0, hb = 0;
          cards.forEach((c, i) => { if (ha <= hb) { ha += hs[i] + 8; } else { hb += hs[i] + 8; bb.appendChild(c); } });
        });
      };
      let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(balanceAll, 150); });
      window.addEventListener('load', balanceAll);

    enhanceSettingsLayout(wrap);

    // Backup: show the pod size; restore = upload a .pod, the server validates it and keeps the current pod.
    (function () {
      const btn = document.getElementById('restore-btn'), inp = document.getElementById('restore-file'), msg = document.getElementById('restore-msg');
      if (!btn || !inp) return;
      const say = (t, ok) => { msg.style.display = ''; msg.style.color = ok ? 'var(--green, #4ade80)' : 'var(--red, #f87171)'; msg.textContent = t; };
      const mb = n => (n / 1048576).toFixed(1) + ' MB';
      const esc = t => String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      const post = (u) => fetch(u, { method: 'POST', credentials: 'include' }).then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, ...j })));
      async function loadStatus() {
        const box = document.getElementById('backup-status'), off = document.getElementById('offload-btn');
        try {
          const st = await fetch('/api/backup/status', { credentials: 'include' }).then(r => r.json());
          const over = st.podBytes > st.warnMb * 1048576;
          const lines = [];
          lines.push('Pod file: <b style="color:' + (over ? 'var(--red, #f87171)' : 'var(--text)') + '">' + mb(st.podBytes) + '</b>' + (st.mediaInPodCount ? ' · media inside the file: ' + mb(st.mediaInPodBytes) + ' (' + st.mediaInPodCount + ' files)' : ''));
          if (over) lines.push('<span style="color:var(--red, #f87171)">Larger than your ' + st.warnMb + ' MB limit' + (st.mediaInPodCount ? ' — moving the media out would shrink it.' : '.') + '</span>');
          if (st.mediaInPodCount && st.mediaBackend === 'blob') lines.push('To move media out, first choose a media backend under Settings → Media (local folder, S3 or GitHub).');
          lines.push('Last backup: ' + (st.last ? new Date(st.last).toLocaleString() : '<b>none yet</b>') + ' · automatic: ' + (st.auto.days > 0 ? 'every ' + st.auto.days + ' days, keeping ' + st.auto.keep : 'off') + ' · folder <code>' + esc(st.auto.dir) + '</code>');
          if (st.files.length) lines.push('On the server: ' + st.files.slice(0, 4).map(f => esc(f.name) + ' (' + mb(f.size) + ')').join(', ') + (st.files.length > 4 ? ' …' : ''));
          box.innerHTML = lines.join('<br>');
          off.style.display = (st.mediaInPodCount && st.mediaBackend !== 'blob') ? '' : 'none';
        } catch { box.textContent = ''; }
      }
      loadStatus();
      document.getElementById('backup-run')?.addEventListener('click', async (e) => {
        e.target.disabled = true; say('Backing up…', true);
        const r = await post('/api/backup/run'); e.target.disabled = false;
        if (r.ok) { say('Saved ' + r.name + ' (' + mb(r.size) + ')', true); loadStatus(); } else say(r.error || 'Backup failed', false);
      });
      document.getElementById('offload-btn')?.addEventListener('click', async (e) => {
        if (!confirm('Move all media stored inside the pod to the configured media backend?\n\nMake a backup first. Files are uploaded one by one; a file that fails stays where it is. Afterwards the pod file can be shrunk.')) return;
        e.target.disabled = true; let moved = 0, failed = 0, last;
        do {
          say('Moving media… ' + moved + ' done' + (failed ? ', ' + failed + ' failed' : ''), true);
          last = await post('/api/backup/offload-media?limit=25');
          if (!last.ok) { say(last.error || 'Moving failed', false); e.target.disabled = false; return; }
          moved += last.moved; failed += last.failed.length;
          if (last.moved === 0 && last.remaining > 0) break;   // nothing progressed: stop instead of looping
        } while (last.remaining > 0);
        let msg = 'Moved ' + moved + ' file(s)' + (failed ? ', ' + failed + ' failed (kept in the pod)' : '') + '.';
        if (moved) { const v = await post('/api/backup/vacuum'); if (v.ok) msg += ' Pod file ' + mb(v.before) + ' → ' + mb(v.after) + '.'; }
        say(msg, failed === 0); e.target.disabled = false; loadStatus();
      });
      btn.addEventListener('click', () => inp.click());
      inp.addEventListener('change', async () => {
        const f = inp.files[0]; inp.value = '';
        if (!f) return;
        if (!confirm('Restore "' + f.name + '"?\n\nThis replaces ALL content, media, users and settings with the backup. A copy of the current pod is kept next to it (…before-restore-…). You will be signed out.')) return;
        const fd = new FormData(); fd.append('file', f);
        btn.disabled = true; say('Restoring…', true);
        try {
          const r = await fetch('/api/backup/restore', { method: 'POST', body: fd, credentials: 'include' });
          const j = await r.json().catch(() => ({}));
          if (!r.ok || !j.ok) { say(j.error || 'Restore failed (' + r.status + ')', false); btn.disabled = false; return; }
          say('Restored: ' + j.entries + ' entries. ' + (j.warnings || []).join(' ') + ' Signing out…', true);
          setTimeout(() => { location.href = '/login.html'; }, (j.warnings || []).length ? 6000 : 2500);
        } catch (e) { say('Restore failed: ' + e.message, false); btn.disabled = false; }
      });
    })();

    // Media backend: show/hide conditional fields
    function updateMediaFields() {
      const v = document.getElementById('media-backend-select')?.value ?? 'blob';
      document.getElementById('media-local-fields').style.display  = v === 'local'  ? '' : 'none';
      document.getElementById('media-s3-fields').style.display     = v === 's3'     ? '' : 'none';
      document.getElementById('media-github-fields').style.display = v === 'github' ? '' : 'none';
    }
    document.getElementById('media-backend-select')?.addEventListener('change', updateMediaFields);
    updateMediaFields();

    // Preview URLs — populate one row per collection
    (async () => {
      const rows = document.getElementById('preview-url-rows');
      if (!rows) return;
      try {
        const cols = await fetch('/api/collections', { credentials: 'include' }).then(r => r.json());

    async function renderApiKeys() {

          <span style="flex:1;font-family:var(--mono);font-size:10px;color:var(--heading)">${esc(k.label)}${k.scope==='draft-write'?' <span style="color:var(--gold)" title="Can create and edit drafts over MCP (never publish)">· drafts</span>':''}${k.collections?` <span style="color:var(--muted)" title="Limited to these collections">· ${esc(k.collections.join(', '))}</span>`:''}${k.expires?` <span style="color:${k.expires < new Date().toISOString().slice(0,10) ? 'var(--red)' : 'var(--muted)'}">· ${k.expires < new Date().toISOString().slice(0,10) ? 'expired' : 'until'} ${esc(k.expires)}</span>`:''}${k.rateLimit?` <span style="color:var(--muted)">· ${esc(k.rateLimit)}/min</span>`:''}</span>

          <span style="font-size:9px;color:var(--muted)">${k.created}</span>

    const up = document.getElementById('pod-uptime');
    const cl = document.getElementById('pod-collections-list');
    const tc = document.getElementById('pod-total-entries');
    const cc = document.getElementById('pod-col-count');

    if (pf) pf.textContent = info.podPath ?? health.pod ?? '—';
    if (vf) vf.textContent = `v${info.formatVersion ?? 1}`;
    if (av) av.textContent = health.version ? `v${health.version}` : '—';
    if (up && health.uptime != null) {
      const s = health.uptime, h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
      up.textContent = h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    // Nav config state
    const navHiddenSet = new Set((info.nav?.hidden) || []);
    let navGroupsObj = info.nav?.groups || {};
    if (typeof navGroupsObj !== 'object' || navGroupsObj === null) navGroupsObj = {};
    const existingGroupNames = () => Object.keys(navGroupsObj);
    const colGroupOf = (colId) => {
      for (const [g, ids] of Object.entries(navGroupsObj)) {
        if (Array.isArray(ids) && ids.includes(colId)) return g;
      }
      return '';
    };

    if (cl) {
      const cols = info.collections ?? [];
      const total = cols.reduce((n, c) => n + (c.total ?? 0), 0);
      if (tc) tc.textContent = total;
      if (cc) cc.textContent = cols.length;

      function renderNavColList() {
        const groups = existingGroupNames();
        cl.innerHTML = cols.length
          ? cols.map(c => {
              const hidden = navHiddenSet.has(c.id);
              const group  = colGroupOf(c.id);
              return `<div class="pod-col-row" style="gap:8px">
                <label class="toggle" style="flex-shrink:0" title="${hidden ? 'Hidden' : 'Visible'}">
                  <input type="checkbox" class="nav-vis-cb" data-col="${c.id}" ${hidden ? '' : 'checked'} />
                  <span class="toggle-slider"></span>
                </label>
                <span class="pod-col-name" style="flex:1;${hidden ? 'opacity:.4' : ''}">${orbEsc(c.label)}</span>
                <select class="input nav-group-sel" data-col="${c.id}" style="width:auto;min-width:90px;font-size:10px;padding:3px 6px;">
                  <option value="">— no group —</option>
                  ${groups.map(g => `<option value="${g}" ${group===g?'selected':''}>${g}</option>`).join('')}
                </select>
                <span class="pod-col-count">${c.total ?? 0}</span>
              </div>`;
            }).join('')
          : '<div class="pod-col-row"><span class="pod-col-name" style="color:var(--muted)">No collections</span></div>';

        cl.querySelectorAll('.nav-vis-cb').forEach(cb => {
          cb.addEventListener('change', () => {
            if (cb.checked) navHiddenSet.delete(cb.dataset.col);
            else navHiddenSet.add(cb.dataset.col);
          });
        });
        cl.querySelectorAll('.nav-group-sel').forEach(sel => {
          sel.addEventListener('change', () => {
            const colId = sel.dataset.col;
            for (const [g, ids] of Object.entries(navGroupsObj)) {
              const idx = ids.indexOf(colId);
              if (idx !== -1) ids.splice(idx, 1);
            }
            if (sel.value) {
              if (!navGroupsObj[sel.value]) navGroupsObj[sel.value] = [];
              navGroupsObj[sel.value].push(colId);
            }
          });
        });
      }
      renderNavColList();

      document.getElementById('nav-add-group-btn')?.addEventListener('click', () => {
        const inp = document.getElementById('nav-new-group');
        const name = inp?.value.trim();
        if (!name) return;
        if (!navGroupsObj[name]) navGroupsObj[name] = [];
        inp.value = '';
        renderNavColList();
      });

      document.getElementById('nav-save-btn')?.addEventListener('click', async () => {
        const cleanGroups = {};
        for (const [g, ids] of Object.entries(navGroupsObj)) {
          if (ids.length) cleanGroups[g] = ids;
        }
        await saveMeta([
          ['nav.hidden', [...navHiddenSet].join(',')],
          ['nav.groups', Object.keys(cleanGroups).length ? JSON.stringify(cleanGroups) : ''],
        ]);
        showBanner('site-banner', 'banner-ok', 'Navigation saved — reloading…');
        setTimeout(() => location.reload(), 600);
      });
    }

    // ── Templates ──────────────────────────────────────────────────────
    function tplBanner(cls, text) {
      const el = document.getElementById('tpl-banner');
      if (!el) return;
      el.className = 'banner ' + cls;
      el.textContent = (cls === 'banner-ok' ? '✓ ' : '✕ ') + text;
      el.style.display = '';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    // Available built-in templates
    async function loadAvailableTemplates() {
      const templates = await fetch('/api/templates/available', { credentials: 'include' }).then(r => r.json()).catch(() => []);
      const wrap = document.getElementById('tpl-available');
      if (!wrap) return;
      wrap.innerHTML = templates.map(t => `
        <button type="button" class="btn btn-ghost btn-sm tpl-install-btn" data-id="${t.id}"
          ${t.installed ? 'disabled style="opacity:.5"' : ''}
          title="${t.description}">
          ${t.installed ? '✓ ' : t.partial ? '◐ ' : '+ '}${t.label}
        </button>
      `).join('');
      wrap.querySelectorAll('.tpl-install-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Installing…';
          const res = await fetch(`/api/templates/install/${btn.dataset.id}`, { method: 'POST', credentials: 'include' });
          const json = await res.json();
          if (res.ok) {
            tplBanner('banner-ok', `Installed: ${json.created.join(', ')}${json.skipped.length ? ' (skipped: ' + json.skipped.join(', ') + ')' : ''} — ${json.entries} sample entries`);
            btn.textContent = '✓ ' + btn.textContent.replace('Installing…', '').trim();
          } else {
            tplBanner('banner-err', json.error || 'Install failed');
            btn.disabled = false;
          }
          loadAvailableTemplates();
          // Refresh pod info + export checkboxes
          refreshExportCols();
        });
      });
    }

    // Export: collection checkboxes
    async function refreshExportCols() {
      const cols = await fetch('/api/collections', { credentials: 'include' }).then(r => r.json()).catch(() => []);
      const wrap = document.getElementById('tpl-export-cols');
      if (!wrap) return;
      wrap.innerHTML = cols.map(c => `
        <label style="font-size:10px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg0);transition:border-color .12s;">
          <input type="checkbox" class="tpl-exp-cb" value="${c.id}" style="accent-color:var(--accent);width:12px;height:12px;" />
          ${c.label}
        </label>
      `).join('');
      const exportBtn = document.getElementById('tpl-export-btn');
      wrap.querySelectorAll('.tpl-exp-cb').forEach(cb => {
        cb.addEventListener('change', () => {
          const any = wrap.querySelectorAll('.tpl-exp-cb:checked').length > 0;
          exportBtn.disabled = !any;
        });
      });
    }

    // Export button
    document.getElementById('tpl-export-btn')?.addEventListener('click', async () => {
      const checked = [...document.querySelectorAll('.tpl-exp-cb:checked')].map(cb => cb.value);
      if (!checked.length) return;
      const includeEntries = document.getElementById('tpl-export-entries')?.checked ?? true;
      const res = await fetch('/api/templates/export', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ collections: checked, includeSampleEntries: includeEntries }),
      });
      if (!res.ok) { tplBanner('banner-err', 'Export failed'); return; }
      const data = await res.json();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `${data.id}.orbiter-template.json`;
      a.click();
      URL.revokeObjectURL(url);
      tplBanner('banner-ok', `Exported ${checked.length} collection(s)`);
    });

    // Import button
    document.getElementById('tpl-import-btn')?.addEventListener('click', () => {
      const fi = document.createElement('input');
      fi.type = 'file';
      fi.accept = '.json,.orbiter-template.json';
      fi.onchange = async () => {
        const file = fi.files[0];
        if (!file) return;
        const status = document.getElementById('tpl-import-status');
        if (status) status.textContent = 'Importing…';
        try {
          const text = await file.text();
          const template = JSON.parse(text);
          if (!template.collections) throw new Error('Invalid template file');
          const res = await fetch('/api/templates/import', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: text,
          });
          const json = await res.json();
          if (res.ok) {
            tplBanner('banner-ok', `Imported: ${json.created.join(', ') || 'none new'}${json.skipped.length ? ' (skipped: ' + json.skipped.join(', ') + ')' : ''} — ${json.entries} entries`);
            if (status) status.textContent = '';
            loadAvailableTemplates();
            refreshExportCols();
          } else {
            tplBanner('banner-err', json.error || 'Import failed');
            if (status) status.textContent = '';
          }
        } catch (e) {
          tplBanner('banner-err', 'Invalid template file: ' + e.message);
          if (status) status.textContent = '';
        }
      };
      fi.click();
    });

    loadAvailableTemplates();
    refreshExportCols();
  </script>
</main>
  </div>

  <script src="/search.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/router.js"></script>
</body>
</html>
