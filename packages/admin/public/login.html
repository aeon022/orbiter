<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbiter — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-mark"></div>
        <div class="login-logo-mark">ORBITER</div>
        <div class="login-logo-sub">Admin</div>
      </div>
      <div class="login-card" role="main">
        <h2 role="heading" aria-level="1">Sign in</h2>
        <div class="login-error" id="error"></div>
        <form id="login-form">
          <div class="field">
            <label class="label" for="username">Username</label>
            <input class="input" id="username" name="username" type="text" autocomplete="username" autofocus required />
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <div class="field" id="code-field" style="display:none">
            <label class="label" for="code">Authentication code</label>
            <input class="input" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456 or a recovery code" />
          </div>
          <button class="btn btn-primary" style="width:100%;margin-top:8px;justify-content:center" type="submit" id="submit-btn">
            Sign in
          </button>
        </form>
        <div id="digiid-wrap" style="margin-top:16px;text-align:center">
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px">or</div>
          <button class="btn" type="button" id="digiid-btn" data-on-click="digiidLogin()" style="width:100%;justify-content:center">Sign in with Digi-ID</button>
          <div id="digiid-box" style="margin-top:12px"></div>
          <div id="digiid-msg" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/qrcode.js"></script>
  <script src="/digiid.js"></script>
  <script>
    window.digiidLogin = function () {
      var box = document.getElementById('digiid-box'), msg = document.getElementById('digiid-msg');
      msg.textContent = 'Starting…';
      fetch('/api/digiid/challenge', { method: 'POST', credentials: 'include' }).then(function (r) { return r.json(); }).then(function (ch) {
        if (!ch.uri) { msg.textContent = ch.error || 'Digi-ID is not available.'; return; }
        msg.textContent = 'Scan with a Digi-ID wallet (DigiByte Go, Digi-ID app).';
        orbDigiid.show(box, ch, function (st) {
          if (st === 'ok') { location.replace('/dashboard.html'); return; }
          msg.textContent = st === 'unknown' ? 'This address is not linked to an account. Sign in with your password and link it under Account.' : 'The code expired. Try again.';
        });
      }).catch(function () { msg.textContent = 'Network error'; });
    };
  </script>

  <script type="module">
    // Redirect if already logged in
    const me = await fetch('/api/auth/me', { credentials: 'include' }).then(r => r.json()).catch(() => null);
    if (me?.user) location.replace('/dashboard.html');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn   = document.getElementById('submit-btn');
      const error = document.getElementById('error');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in…';
      error.classList.remove('visible');

      const res  = await fetch('/api/auth/login', {
        method:      'POST',
        credentials: 'include',
        headers:     { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: e.target.username.value,
          password: e.target.password.value,
          code: e.target.code.value,
        }),
      });
      const data = await res.json();

      if (res.ok) {
        location.replace('/dashboard.html');
      } else {
        if (data.totp) {
          document.getElementById('code-field').style.display = '';
          document.getElementById('code').focus();
        }
        error.textContent = data.error ?? 'Login failed';
        error.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
