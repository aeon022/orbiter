name: Version Guard

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check package versions were bumped
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine changed files
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            echo "Diffing against merge-base $BASE (PR into ${{ github.base_ref }})"
            git diff --name-only "$BASE" HEAD > changed_files.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              if git cat-file -e HEAD~1 2>/dev/null; then
                echo "before-sha unusable (force-push / new branch) — falling back to HEAD~1"
                git diff --name-only HEAD~1 HEAD > changed_files.txt
              else
                echo "no usable previous commit — checking every file under packages/"
                git ls-files packages > changed_files.txt
              fi
            else
              git diff --name-only "$BEFORE" HEAD > changed_files.txt
            fi
          fi
          echo "--- changed files ---"
          cat changed_files.txt

      - name: Check version bumps for touched packages
        run: |
          FAILED=0
          for dir in packages/*/; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || continue
            if grep -q "^$dir/" changed_files.txt; then
              echo "::group::$dir"
              node scripts/check-published-version.mjs "$dir" || FAILED=1
              echo "::endgroup::"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "One or more touched packages need a version bump before merging — see logs above."
            exit 1
          fi
