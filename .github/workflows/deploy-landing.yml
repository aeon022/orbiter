name: Build & Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # docs pages show their last git change

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install librsvg (for OG card PNG generation)
        run: sudo apt-get install -y librsvg2-bin

      - name: Install dependencies
        run: npm install --workspace=apps/landing

      - name: Build
        run: npm run build --workspace=apps/landing
        env:
          PUBLIC_GIT_HASH: ${{ github.sha }}

      - name: Deploy to branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/landing/dist
          publish_branch: deploy/landing
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
