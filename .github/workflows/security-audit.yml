name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Catch newly-disclosed CVEs in dependencies we didn't touch ourselves.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit
        run: npm audit --audit-level=high
