name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Catch newly-disclosed CVEs in dependencies we didn't touch ourselves.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: npm audit
        run: npm audit --audit-level=high
